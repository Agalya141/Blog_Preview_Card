<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Blog Preview Card</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">
    </head>
    <body>
        <main class="card">
            <div class="image">
                <img src="illustration-article.svg" alt="illustration article" class="illustration_img" width="400" height="200">
            </div>
            <div class="about">
                <p class="about-text">Learning</p>
                <p class="published">Published 21 Dec 2023</p>
            </div>
            <article class="content">
                <h1>HTML & CSS foundations</h1>
                <p class="text">These languages are the backbone of every website, defining structure, content and presentation.</p>
            </article>
            <div class="profile">
                <img src="image-avatar.webp" alt="author image" class="author">
                <span class="author_name">Greg Hooper</span>
            </div>
        </main>
    </body>
</html>
